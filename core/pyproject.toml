[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssswet-core"
version = "0.1.0"
description = "Verification-first research orchestration core for SSSWET"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]\npdf = ["pypdf>=5,<7"]\n\n[tool.pytest.ini_options]
pythonpath = ["."]

[project.scripts]
ssswet-local = "ssswet_core.server:main"
ssswet-run = "ssswet_core.research_cli:main"
