name: SSSWET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Validate automatic report processor
        run: python -m py_compile .github/scripts/process_public_report.py
      - name: Enforce public web accessibility and asset budgets
        if: matrix.python-version == '3.11'
        run: |
          python -m py_compile .github/scripts/check_web_quality.py
          python .github/scripts/check_web_quality.py
      - name: Set up Node.js for web interface checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate web interface scripts and locales
        run: |
          node --check web/technology-feasibility.js
          node --check web/research-journal.js
          node --check web/app.js
          node --check web/platform-downloads.js
          node --check web/donation.js
          node --check web/technology-categories.js
          node --check web/technology-supercategories-data.js
          node --check web/technology-supercategories.js
          node --check web/donation-config.js
          node --check web/product-purchase-config.js
          node --check web/temporal-clock.js
          node --check web/clock-alignment-workspace.js
          node --check web/gps-scenario-model.js
          node --check web/virtual-time-travel.js
          node --check web/keyframe-continuity.js
          node --check web/keyframe-correspondence.js
          node --check web/virtual-time-travel-link.js
          node --check web/service-worker-updates.js
          node --check web/sw.js
          node --check desktop/main.cjs
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); JSON.parse(require('fs').readFileSync('capacitor.config.json', 'utf8')); JSON.parse(require('fs').readFileSync('web/manifest.json', 'utf8'))"
          node --check web/report-project.js
          node --check web/locales.js
          node --check web/bot-personality.js
          node --check web/bot-live-room.js
          node web/test-locales.cjs
          node web/test-service-worker.cjs
          node web/test-technology-supercategories.cjs
          node web/test-keyframe-continuity.cjs
          node web/test-keyframe-correspondence.cjs
          node web/test-temporal-clock.cjs
          node web/test-clock-alignment-workspace.cjs
          node web/test-gps-scenario-model.cjs
          node web/test-keyframe-spatial-distribution.cjs
          node web/test-bot-personality.cjs
      - name: Run core tests
        working-directory: core
        run: python -m pytest -q
      - name: Benchmark bounded research workflow utilities
        if: matrix.python-version == '3.12'
        run: python .github/scripts/benchmark_research_quality.py
      - name: Benchmark research workbench bounded workloads
        if: matrix.python-version == '3.12'
        run: |
          python -m py_compile .github/scripts/benchmark_research_workbench.py
          python .github/scripts/benchmark_research_workbench.py
      - name: Benchmark public media research workbench
        if: matrix.python-version == '3.12'
        run: |
          python -m py_compile .github/scripts/benchmark_public_media_workbench.py
          python .github/scripts/benchmark_public_media_workbench.py
      - name: Validate and benchmark research assurance upgrades
        if: matrix.python-version == '3.12'
        run: |
          python -m py_compile core/ssswet_core/assurance_common.py core/ssswet_core/agent_handoff_contract.py core/ssswet_core/research_memory_snapshot.py core/ssswet_core/media_source_lineage.py core/ssswet_core/claim_context_audit.py core/ssswet_core/translation_integrity.py core/ssswet_core/reviewer_concordance.py core/ssswet_core/temporal_evidence_window.py core/ssswet_core/privacy_export_gate.py core/ssswet_core/vtt_spatial_uncertainty.py core/ssswet_core/rescue_route_redundancy.py
          python -m py_compile .github/scripts/benchmark_research_assurance.py
          python .github/scripts/benchmark_research_assurance.py
