name: SSSWET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Set up Node.js for web interface checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate web interface scripts and locales
        run: |
          node --check web/technology-feasibility.js
          node --check web/research-journal.js
          node --check web/app.js
          node --check web/locales.js
          node web/test-locales.cjs
      - name: Run core tests
        working-directory: core
        run: python -m pytest -q
