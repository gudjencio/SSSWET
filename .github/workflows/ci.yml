name: SSSWET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest
      - name: Validate automatic report processor
        run: python -m py_compile .github/scripts/process_public_report.py
      - name: Set up Node.js for web interface checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate web interface scripts and locales
        run: |
          node --check web/technology-feasibility.js
          node --check web/research-journal.js
          node --check web/app.js
          node --check web/platform-downloads.js
          node --check web/donation.js
          node --check web/technology-categories.js
          node --check web/donation-config.js
          node --check web/product-purchase-config.js
          node --check web/virtual-time-travel.js
          node --check web/keyframe-continuity.js
          node --check desktop/main.cjs
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); JSON.parse(require('fs').readFileSync('capacitor.config.json', 'utf8')); JSON.parse(require('fs').readFileSync('web/manifest.json', 'utf8'))"
          node --check web/report-project.js
          node --check web/locales.js
          node --check web/bot-personality.js
          node --check web/bot-live-room.js
          node web/test-locales.cjs
          node web/test-keyframe-continuity.cjs
          node web/test-bot-personality.cjs
      - name: Run core tests
        working-directory: core
        run: python -m pytest -q
