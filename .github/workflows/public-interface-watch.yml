name: SSSWET public interface browser watch

on:
  pull_request:
    paths:
      - "web/**"
      - "tests/public_site_smoke.py"
      - ".github/workflows/public-interface-watch.yml"
  schedule:
    - cron: "13 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ssswet-public-interface-watch
  cancel-in-progress: false

jobs:
  public-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate service worker syntax
        run: node --check web/sw.js
      - name: Install browser test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start pull-request preview
        id: preview
        if: github.event_name == 'pull_request'
        run: |
          python -m http.server 4173 --directory web > /tmp/ssswet-preview.log 2>&1 &
          echo "url=http://127.0.0.1:4173/" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ssswet-preview.log
          exit 1
      - name: Visit and exercise the candidate or published interface
        id: smoke
        continue-on-error: true
        env:
          SSSWET_PUBLIC_URL: ${{ steps.preview.outputs.url || 'https://gudjencio.github.io/SSSWET/' }}
          SSSWET_EXPECT_NETWORK_FIRST: ${{ github.event_name != 'pull_request' }}
        run: python tests/public_site_smoke.py
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssswet-public-site-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Create or update a published-site incident
        if: steps.smoke.outcome == 'failure' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Public SSSWET interface browser check failed";
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled or manually requested real-browser smoke test detected a published-interface failure.",
              "",
              "Public URL: https://gudjencio.github.io/SSSWET/",
              `Workflow run: ${runUrl}`,
              `Commit: ${context.sha}`,
              `Detected: ${new Date().toISOString()}`,
              "",
              "Download the browser evidence artifact and inspect the run logs. Reproduce the defect against the deployed page and current source before proposing a fix. Do not auto-merge or deploy a repair."
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body
              });
            }
      - name: Fail the workflow when the tested interface is unhealthy
        if: steps.smoke.outcome == 'failure'
        run: exit 1
