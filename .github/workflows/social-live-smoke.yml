name: Social research live smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: read

concurrency:
  group: social-live-smoke
  cancel-in-progress: false

jobs:
  public-multilingual-smoke:
    name: Public multilingual API checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0, Node 24
        with:
          python-version: "3.12"
      - name: Run public API smoke checks
        run: python core/scripts/social_live_smoke.py
      - name: Upload bounded public metadata report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0, Node 24
        with:
          name: social-live-smoke-report
          path: social-live-smoke-report.json
          if-no-files-found: ignore
          retention-days: 7
