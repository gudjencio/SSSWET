name: Build SSSWET applications

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release-apps.yml"
      - "package.json"
      - "capacitor.config.json"
      - "desktop/**"
      - "web/**"
      - "core/tests/test_github_actions_node24_pins.py"

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis
          - os: macos-latest
            args: --mac dmg
          - os: ubuntu-latest
            args: --linux AppImage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install
      - run: npx electron-builder --publish never ${{ matrix.args }}
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0, Node 24
        with:
          name: ssswet-desktop-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Android application package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0, Node 24
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Prepare installable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SSSWET-android-debug.apk
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0, Node 24
        with:
          name: ssswet-android
          path: SSSWET-android-debug.apk
          if-no-files-found: error

  release:
    name: Publish application downloads
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0, Node 24
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3, Node 24
        with:
          generate_release_notes: true
          files: release-assets/*
