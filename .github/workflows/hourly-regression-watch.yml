name: SSSWET Hourly Regression Watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssswet-hourly-regression-watch
  cancel-in-progress: true

jobs:
  regression-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Validate Python sources
        run: python -m compileall -q core/ssswet_core
      - name: Validate web scripts and language catalogue
        run: |
          node --check web/locales.js
          node --check web/app.js
          node --check web/bot-personality.js
          node --check web/bot-live-room.js
          node web/test-locales.cjs
          node web/test-bot-personality.cjs
      - name: Run complete core test suite
        working-directory: core
        run: python -m pytest -q
