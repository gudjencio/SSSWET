name: SSSWET Hourly Regression Watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssswet-hourly-regression-watch
  cancel-in-progress: true

jobs:
  regression-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Validate Python sources
        run: python -m compileall -q core/ssswet_core
      - name: Validate web scripts and language catalogue
        run: |
          node --check web/locales.js
          node --check web/app.js
          node --check web/bot-personality.js
          node --check web/bot-live-room.js
          node --check web/temporal-clock.js
          node --check web/clock-alignment-workspace.js
          node --check web/gps-scenario-model.js
          node web/test-locales.cjs
          node web/test-bot-personality.cjs
          node web/test-temporal-clock.cjs
          node web/test-clock-alignment-workspace.cjs
          node web/test-gps-scenario-model.cjs
      - name: Run complete core test suite
        working-directory: core
        run: python -m pytest -q
