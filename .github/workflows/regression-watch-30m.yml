name: SSSWET 30-minute regression watch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ssswet-regression-watch
  cancel-in-progress: false

jobs:
  regression-watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate web scripts and localization
        run: |
          node --check web/virtual-time-travel.js
          node --check web/keyframe-continuity.js
          node --check web/keyframe-correspondence.js
          node --check web/virtual-time-travel-link.js
          node --check web/temporal-clock.js
          node --check web/gps-scenario-model.js
          node web/test-locales.cjs
          node web/test-keyframe-continuity.cjs
          node web/test-keyframe-correspondence.cjs
          node web/test-keyframe-spatial-distribution.cjs
          node web/test-bot-personality.cjs
          node web/test-temporal-clock.cjs
          node web/test-gps-scenario-model.cjs

      - name: Run core regression tests
        working-directory: core
        run: python -m pytest -q

      - name: Report a failing regression check
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Scheduled regression check failed";
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "The scheduled 30-minute regression watch detected a failing check.",
              "",
              `- Workflow run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Detected at: ${new Date().toISOString()}`,
              "",
              "Review the workflow logs, reproduce the failure, and submit a tested fix. This report is diagnostic; it does not mean the defect has been repaired."
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
