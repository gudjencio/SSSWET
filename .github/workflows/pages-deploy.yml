name: Deploy SSSWET to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static application
        run: |
          test -f web/index.html
          test -f web/app.js
          test -f web/locales.js
          node --check web/app.js
          node --check web/locales.js
          node --check web/platform-downloads.js
          node --check web/donation.js
          node --check web/technology-categories.js
          node --check web/donation-config.js
          node --check web/product-purchase-config.js
          node --check web/version-center.js
          node --check web/service-worker-updates.js
          node --check web/sw.js
          node --check web/clock-alignment-workspace.js
          node web/test-locales.cjs
          node web/test-service-worker.cjs
          node web/test-clock-alignment-workspace.cjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
