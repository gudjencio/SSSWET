name: SSSWET Performance Benchmarks

on:
  pull_request:
    branches: [main, perf/reproducible-browser-benchmarks-2026-11-05]
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ssswet-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install benchmark tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start local public interface
        run: |
          python -m http.server 8765 --directory web > /tmp/ssswet-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ssswet-http.log
          exit 1

      - name: Run desktop and mobile benchmarks
        run: |
          python .github/scripts/performance_benchmark.py \
            --url http://127.0.0.1:8765/ \
            --trials 3 \
            --output performance-results/benchmark.json

      - name: Publish benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssswet-performance-${{ github.run_id }}
          path: performance-results/
          if-no-files-found: warn
          retention-days: 90
